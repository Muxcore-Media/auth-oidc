# auth-oidc RBAC Policy
#
# Roles are assigned from IdP claims (see AUTH_OIDC_ROLES_CLAIM / AUTH_OIDC_ROLE_MAP).
# Permission matching:
#   "*"            — superuser (all actions on all resources)
#   "resource.*"   — all actions on a resource (e.g., "media.*")
#   "resource.action" — specific action (e.g., "media.view")
#   "*.action"     — specific action on any resource

roles:
  admin:
    permissions: ["*"]
  manager:
    permissions:
      - "media.*"
      - "storage.*"
      - "modules.read"
      - "modules.manage"
  user:
    permissions:
      - "media.request"
      - "media.view"
      - "media.search"
  viewer:
    permissions:
      - "media.view"
      - "media.search"
